name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Asegúrate de que esta sea el nombre de tu rama principal

  # Permite ejecutar este workflow manualmente desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # Publishable/anon key: pública por diseño (protegida por RLS), viaja en
          # el bundle del cliente igual. No es un secreto.
          VITE_SUPABASE_URL: https://owgxvlvzavqgjqrbppeg.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_QRQwke1T0GlBhDJhQzKlAA_8McvEnGv

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
